<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AQS Supply Hire</title>
<link rel="icon" id="favicon" href="assets/logo-aqs.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top app bar + control panel (breadcrumb, actions, status steps) over a list or a document "sheet" with an activity log beneath, like an ERP back office. */
:root{
  --bg:#eef1f2; --surface:#ffffff; --sunk:#f6f8f8; --ink:#1a2226; --muted:#5b6870; --line:#d6dde0;
  --primary:#1d5a6e; --primary-ink:#ffffff; --primary-soft:#e2eef2;
  --amber:#b86e00; --amber-soft:#fbefd9;
  --ok:#2f7a45; --ok-soft:#e1f1e5; --bad:#b23b32; --bad-soft:#f8e3e1; --info:#2f5fa8; --info-soft:#e3ebf8; --grey-soft:#e9ecee;
  --bar:#16343f; --bar-ink:#dfe9ec;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171a; --surface:#192125; --sunk:#151c1f; --ink:#e3e9eb; --muted:#94a3aa; --line:#2b373c;
  --primary:#56a8c2; --primary-ink:#08161b; --primary-soft:#1d3640;
  --amber:#e6a446; --amber-soft:#3a2c14; --ok:#6cc487; --ok-soft:#173022; --bad:#ec8077; --bad-soft:#3b1d1a; --info:#86aef0; --info-soft:#1b2a44; --grey-soft:#253034;
  --bar:#0b1215; --bar-ink:#cfdde1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171a; --surface:#192125; --sunk:#151c1f; --ink:#e3e9eb; --muted:#94a3aa; --line:#2b373c;
  --primary:#56a8c2; --primary-ink:#08161b; --primary-soft:#1d3640;
  --amber:#e6a446; --amber-soft:#3a2c14; --ok:#6cc487; --ok-soft:#173022; --bad:#ec8077; --bad-soft:#3b1d1a; --info:#86aef0; --info-soft:#1b2a44; --grey-soft:#253034;
  --bar:#0b1215; --bar-ink:#cfdde1; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
.appbar .in{display:flex;align-items:center;gap:20px;min-height:48px;overflow-x:auto;scrollbar-width:none}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;white-space:nowrap;color:#fff}
.brand i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;background:var(--amber);color:#1a1205;font-style:normal;font-size:13px}
.brand i.navy{background:#1c3a6e;color:#f2c230;box-shadow:inset 0 0 0 1px #f2c230}
.nav{display:flex;gap:2px}
.nav a{color:var(--bar-ink);text-decoration:none;padding:6px 10px;border-radius:5px;white-space:nowrap;opacity:.82}
.nav a:hover{opacity:1;background:rgba(255,255,255,.07)}
.nav a.on{opacity:1;background:rgba(255,255,255,.13);font-weight:500}
.who{margin-left:auto;font-size:12px;opacity:.75;white-space:nowrap}

/* control panel */
.cp{background:var(--surface);border-bottom:1px solid var(--line)}
.cp .in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.crumb{font-family:var(--f-display);font-size:20px;font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;min-width:0}
.crumb a{color:var(--primary);text-decoration:none;cursor:pointer}
.crumb .sep{color:var(--muted)}
.cp .acts{display:flex;gap:6px;flex-wrap:wrap}
.cp .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:var(--r);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.search{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:6px 10px;width:240px;max-width:100%}

/* status steps */
.steps{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.steps span{padding:5px 12px 5px 16px;font-size:13px;color:var(--muted);background:var(--sunk);position:relative;white-space:nowrap}
.steps span+span{border-left:1px solid var(--line)}
.steps span.on{background:var(--primary-soft);color:var(--primary);font-weight:600}

/* main */
main{padding-block:18px 60px}
.wrap{max-width:1180px;margin:0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;background:var(--sunk)}

.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.p-grey{background:var(--grey-soft);color:var(--muted)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-amber{background:var(--amber-soft);color:var(--amber)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.ex{font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);border-radius:4px;padding:0 5px;margin-left:6px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--primary)}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
h2.sec{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0 0 8px;text-wrap:balance}

/* sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;max-width:1080px;margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.doc-no{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1}
.doc-no small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.smart{display:flex;gap:6px;flex-wrap:wrap}
.smart button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;text-align:left;line-height:1.2}
.smart button:hover{background:var(--sunk)}
.smart b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.smart span{font-size:12px;color:var(--muted)}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 36px;margin-bottom:18px}
.fld{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:10px;padding:4px 0}
.fld label{font-weight:600;font-size:13px}
.fld input,.fld select,.fld textarea,.cell{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:5px 2px;border-radius:0}
.fld input:focus,.fld select:focus,.fld textarea:focus,.cell:focus{outline:none;border-bottom-color:var(--primary)}
.fld .ro{padding:5px 2px}
.fld.full{grid-column:1/-1;grid-template-columns:150px minmax(0,1fr)}
select{background:transparent}
select option{background:var(--surface);color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:0}
.tabs span{padding:7px 14px;border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;background:var(--surface);font-weight:600;font-size:13px;margin-bottom:-1px}
.lines{border:1px solid var(--line);border-top:0;overflow-x:auto}
.lines td{padding:4px 8px;vertical-align:middle}
.lines .cell{min-width:60px}
.lines .cell.w{min-width:340px;resize:none;overflow:hidden;font:inherit;line-height:1.35}
.lines td{vertical-align:top}
.pre{white-space:pre-line}
.dchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.dchips button{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.dchips button:hover{color:var(--primary);border-color:var(--primary)}
.noteline td{font-style:italic;color:var(--muted);background:var(--sunk)}
.lines .cell.n{text-align:right;min-width:70px}
.addline{color:var(--primary);background:none;border:0;cursor:pointer;padding:8px;font-weight:500}
.xbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.xbtn:hover{color:var(--bad)}
.totals{display:flex;justify-content:flex-end;margin-top:12px}
.totals table{width:auto;min-width:300px}
.totals td{border:0;padding:3px 12px}
.totals tr.big td{font-size:16px;font-weight:600;border-top:1px solid var(--line);padding-top:7px}
.totals tr.due td{color:var(--bad);font-weight:600}
.notes{margin-top:16px}
.notes textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:8px}
.ribbon{float:right;margin:-6px -10px 0 12px}
.logo-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo-pick img{width:72px;height:72px;object-fit:contain;background:#f9eaea;border:1px solid var(--line);border-radius:6px;padding:4px}
.logo-pick span{font-size:12px;color:var(--muted)}

/* chatter */
.chatter{max-width:1080px;margin:18px auto 0}
.chatter h3{font-family:var(--f-display);font-size:16px;margin:0 0 8px}
.note-in{display:flex;gap:8px;margin-bottom:12px}
.note-in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;background:var(--surface)}
.log{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.log .e{padding:4px 0 10px 14px;position:relative}
.log .e::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.log .m{font-size:12px;color:var(--muted)}

/* empty + banners */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--ink);font-size:20px;margin:0 0 6px}
.empty p{max-width:52ch;margin:0 auto 14px}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:var(--r);z-index:50;font-weight:500;max-width:calc(100% - 32px)}

/* driver tasks */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard .th{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard h3{font-family:var(--f-display);font-size:20px;margin:0}
.tcard dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:2px 0 6px;font-size:13px}
.tcard dt{color:var(--muted)}.tcard dd{margin:0;overflow-wrap:anywhere}
.tact{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.tact .btn{padding:10px 14px;font-size:16px}
.drvpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.drvpick .btn{padding:18px;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:20px}
.drvpick .btn span{font-size:13px;color:var(--muted);font-weight:400}
/* DO sheet */
.dosheet{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.dosheet .in{max-width:640px;margin:0 auto;padding:12px 16px 40px}
.dotop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.dotop b{font-family:var(--f-display);font-size:20px}
.dobox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.dobox h3{font-family:var(--f-display);font-size:16px;margin:0 0 6px}
.dohead{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}.dohead small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.dohead b{font-size:16px}
.dof label,.dobox>label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
.dof input,.doitem textarea,.doitem input{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--sunk);font-size:16px;line-height:1.4;color:var(--ink);font-family:inherit}
.dosheet input[type=date],.dosheet input[type=time]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left}
.dosheet input::-webkit-date-and-time-value{text-align:left}
.dosheet input::-webkit-datetime-edit{padding:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}.two>div{min-width:0}
.doitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;margin-bottom:10px;background:var(--bg)}
.doitem .dih{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;font-size:14px}
.doitem label{display:block;font-weight:600;font-size:13px;margin:8px 0 4px;color:var(--muted)}
.doitem textarea{resize:none;overflow:hidden;min-height:48px}
.donote{font-size:13px;color:var(--muted);margin:0 0 4px}
.sig{width:100%;height:180px;border:2px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none;display:block;cursor:crosshair}
.sig.signed{border-style:solid;border-color:var(--primary)}
.sigbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.dosubmit{width:100%;padding:14px;font-size:16px}
.dodone{text-align:center;padding:40px 8px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.dodone .tick{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:28px;margin:0 auto}
.dodone h2{font-family:var(--f-display);margin:4px 0 0}.dodone a.btn{text-decoration:none;color:inherit;display:block}.dodone .btn{padding:12px;font-size:16px}
.dosum{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;background:var(--ok-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.dosum small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.dosum span{display:block;font-size:13px}
.dosum img{height:44px;background:#fff;border-radius:4px;padding:2px}
@media (max-width:1400px){.who .em{display:none}}
@media (max-width:1100px){.who .lbl{display:none}}
@media (max-width:460px){.brand span{display:none}.who .lbl{display:none}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,22,.5);z-index:40;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:10px;width:min(520px,100%);min-width:0;max-height:calc(100dvh - 32px);overflow:auto;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal .body p{overflow-wrap:anywhere}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:20px;font-weight:600}
.modal .body{padding:14px 18px}
.modal .body .fld{grid-template-columns:120px minmax(0,1fr)}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:520px){.modal header{padding:14px 16px;font-size:18px}.modal .body{padding:14px 16px}.modal .body .fld{grid-template-columns:minmax(0,1fr);gap:2px}.modal footer{padding:12px 16px}.modal footer .btn{flex:1 1 0;padding:12px;font-size:16px}}

.menu-btn{display:none}
@media (min-width:1600px){
  .wrap{max-width:1400px}
  .sheet,.chatter{max-width:1260px}
}
@media (max-width:1024px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .lines .cell{min-width:44px}
  .lines .cell.w{min-width:170px}
  .lines .cell.n{min-width:52px}
  .lines select.cell{max-width:150px}
  .lines td{padding:4px 5px}
}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fld{grid-template-columns:120px minmax(0,1fr)}
}
@media (max-width:1180px){
  /* app bar becomes a menu */
  .appbar .in{overflow:visible;gap:10px;flex-wrap:wrap}
  .menu-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--bar-ink);border-radius:6px;padding:6px 10px;font-weight:500;cursor:pointer}
  .nav{display:none;order:9;width:100%;flex-direction:column;padding:4px 0 10px}
  .appbar.open .nav{display:flex}
  .nav a{padding:11px 10px;font-size:16px;opacity:.9}
  .who{margin-left:auto}
}
@media (max-width:720px){
  .fields{grid-template-columns:minmax(0,1fr)}
  /* lists become stacked cards */
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tfoot,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tbody tr{padding:10px 14px;border-bottom:1px solid var(--line)}
  table.stack tbody tr:last-child{border-bottom:0}
  table.stack td{border:0;padding:3px 0;white-space:normal;display:flex;justify-content:space-between;align-items:baseline;gap:14px;text-align:right;overflow-wrap:anywhere}
  table.stack td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left;flex:none;max-width:45%}
  table.stack td[data-label=""]::before{display:none}
  table.stack td:first-child{font-weight:600;font-size:16px}
  table.stack tfoot tr{display:flex;justify-content:space-between;padding:10px 14px}
  table.stack tfoot td{width:auto;padding:0}
  table.stack tfoot td:empty{display:none}
  /* rental lines: label above each input */
  .lines table.stack tbody tr{padding:10px 12px;position:relative}
  .lines table.stack td{display:block;text-align:left;padding:4px 0}

function tr(v){
  if(LANG!=="en"||!v)return v;
  if(/^\s*cth\./.test(v))return v.replace(/^(\s*)cth\./,"$1e.g.").replace(/\(sewa\)/,"(hire)").replace(/stay site sampai siap/,"stay on site until done");
  const k=v.replace(/\s+/g," ").trim();if(!k)return v;
  let t=EN[k];
  if(t===undefined){for(const [rx,rep] of EN_RX){if(rx.test(k)){t=k.replace(rx,rep);break}}}
  if(t===undefined||t===k)return v;
  const lead=v.match(/^\s*/)[0],trail=v.match(/\s*$/)[0];return lead+t+trail;
}
const TR_ATTRS=["placeholder","title","aria-label"];
function trEl(el){
  if(el.closest&&el.closest("script,style,[data-notr]"))return;
  TR_ATTRS.forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v){const t=tr(v);if(t!==v)el.setAttribute(a,t)}});
}
function translateTree(root){
  if(LANG!=="en"||!root)return;
  if(root.nodeType===3){const p=root.parentElement;if(!p||p.closest("script,style,textarea,[data-notr]"))return;const t=tr(root.nodeValue);if(t!==root.nodeValue)root.nodeValue=t;return}
  if(root.nodeType!==1)return;
  trEl(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while(n=w.nextNode()){if(n.nodeType===1)trEl(n);else translateTree(n)}
}
if(LANG==="en"){
  document.documentElement.lang="en";
  const mo=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")translateTree(m.target);else if(m.type==="attributes")trEl(m.target);else m.addedNodes.forEach(translateTree)}});
  const go=()=>{translateTree(document.body);mo.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TR_ATTRS})};
  document.body?go():document.addEventListener("DOMContentLoaded",go);
}

/* Letter-case rules: names, places, loads and codes in CAPITALS; e-mail in lower case;
   invoice line descriptions keep their sentence case. */
const CASE_UP={customers:["name","regNo","address","contact"],assets:["code","name","plate"],jobs:["no","site","po","pickup","dropoff","load","branch","vehicle","operator","supervisor","vendorName","vendorPlate","vendorDriver"],invoices:["no","ref"]};
const CASE_LOW={customers:["email"]};
function normCase(col,b){
  const up=v=>typeof v==="string"?v.trim().replace(/[ \t]+/g," ").toUpperCase():v;
  (CASE_UP[col]||[]).forEach(k=>{if(k in b)b[k]=up(b[k])});
  (CASE_LOW[col]||[]).forEach(k=>{if(typeof b[k]==="string")b[k]=b[k].trim().toLowerCase()});
  if(col==="jobs"&&b.do){const D=b.do;["lorryReg","customerPo","from","to"].forEach(k=>{if(k in D)D[k]=up(D[k])});(D.items||[]).forEach(it=>{it.desc=up(it.desc);it.qty=up(it.qty)});if(D.receiver)D.receiver.name=up(D.receiver.name);if(D.issuer)D.issuer.name=up(D.issuer.name)}
  return b;
}
async function save(col,id,data){
  if(!S.db){toast("Pangkalan data tidak tersedia. Buka halaman ini sambil log masuk.");throw new Error("nodb")}
  const body=normCase(col,clone(data));delete body.id;
  try{await S.db.collection(col).doc(id).set(body)}
  catch(e){handleWriteErr(e);throw e}
}
async function remove(col,id){try{await S.db.collection(col).doc(id).delete()}catch(e){handleWriteErr(e);throw e}}
function handleWriteErr(e){
  if(e&&e.code==="invalid_argument"){S.canWrite=false;toast("Akaun anda tiada kebenaran mengubah data. Minta pentadbir daftarkan e-mel anda sebagai staf.");render()}
  else if(e&&e.code==="quota_exceeded")toast("Storan penuh. Padam rekod lama untuk tambah yang baharu.");
  else toast("Gagal menyimpan. Cuba lagi sebentar.");
}
function newId(col){return S.db?S.db.collection(col).doc().id:("local"+Date.now())}

/* ---------- names in chatter ---------- */
async function resolveNames(ids){
  if(!S.user)return;const need=ids.filter(i=>i&&!(i in S.names));if(!need.length)return;
  need.forEach(i=>S.names[i]="");
  try{const ps=await S.user.profiles(need);let ch=false;need.forEach(i=>{const nm=(ps[i]&&ps[i].name)||"";if(nm){S.names[i]=nm;ch=true}});if(ch&&!(form&&form.dirty))render()}catch(e){}
}
const nameOf=id=>(id&&S.names[id])||"Pengguna";

/* ---------- routing ---------- */
function go(view,id){form=null;route={view,id:id||null};if(location.hash!=="#"+view)history.replaceState(null,"","#"+view);render();window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(NAV.some(x=>x[0]===v)&&(v!==route.view||route.id)){form=null;route={view:v,id:null};render()}});

/* ---------- render shell ---------- */
function render(){
  if(S.isDriver&&route.view!=="tugasan"){route.view="tugasan";route.id=null;form=null}
  $("#nav").innerHTML=navList().map(([k,t])=>`<a href="#${k}" class="${route.view===k?"on":""}" data-act="nav" data-v="${k}" data-notr>${navLabel(k,t)}</a>`).join("");
  const V=VIEWS[route.view]||VIEWS.utama;const out=V();
  $("#cp").innerHTML=out.cp;$("#main").innerHTML=(S.offline?`<div class="banner">Data belum dapat dicapai. Paparan mungkin tidak terkini.</div>`:"")+(!S.canWrite?`<div class="banner">Akaun anda belum didaftarkan sebagai staf, jadi rekod tidak boleh dilihat atau diubah. Minta pentadbir tambah e-mel anda dalam jadual staf.</div>`:"")+out.main;
  if(out.after)out.after();
  document.querySelectorAll("#main table").forEach(t=>{const th=[...t.querySelectorAll(":scope>thead th")].map(x=>x.textContent.trim());if(!th.length)return;t.classList.add("stack");t.querySelectorAll(":scope>tbody>tr").forEach(tr=>{[...tr.children].forEach((td,i)=>{if(!td.hasAttribute("data-label"))td.setAttribute("data-label",td.colSpan>1?"":(th[i]||""))})})});
  document.querySelectorAll(".lines textarea").forEach(growTA);
  const cur=navList().find(x=>x[0]===route.view);const mc=document.getElementById("menu-cur");if(mc){mc.textContent=cur?navLabel(cur[0],cur[1]):"Menu";mc.setAttribute("data-notr","")}
  const ab=document.getElementById("appbar");if(ab){ab.classList.remove("open");const mb=document.getElementById("menu-btn");if(mb)mb.setAttribute("aria-expanded","false")}
}
addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>document.querySelectorAll(".lines textarea").forEach(growTA),120)});
function growTA(t){t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"}
function crumb(parts){return `<div class="crumb">${parts.map((p,i)=>i<parts.length-1?`<a data-act="crumb" data-v="${p[1]}">${esc(p[0])}</a><span class="sep">/</span>`:`<span>${p[0]}</span>`).join("")}</div>`}
function steps(list,map,cur){return `<div class="steps">${list.map(k=>`<span class="${k===cur?"on":""}">${esc(map[k][0])}</span>`).join("")}</div>`}
function searchBox(view,ph){return `<input class="search" id="q-${view}" placeholder="${esc(ph)}" value="${esc(S.q[view]||"")}" data-q="${view}">`}
function chips(view,opts){const cur=S.flt[view]||"all";return `<div class="chips">${opts.map(([k,t])=>`<button class="chip ${cur===k?"on":""}" data-act="flt" data-view="${view}" data-k="${k}">${esc(t)}</button>`).join("")}</div>`}
function match(view,str){const q=(S.q[view]||"").trim().toLowerCase();return !q||str.toLowerCase().includes(q)}
function emptyBox(title,txt,btn){return `<div class="empty"><h3>${esc(title)}</h3><p>${esc(txt)}</p>${btn||""}</div>`}
const isLoaded=()=>COLS.every(c=>S.loaded.has(c));

/* ---------- VIEWS ---------- */
const VIEWS={};

  const open=posted.filter(x=>x.c.due>0.005);
  const over=open.filter(x=>x.c.pay==="overdue");
  let collected=0;S.invoices.forEach(i=>(i.payments||[]).forEach(p=>{if((p.date||"").slice(0,7)===ym)collected+=n(p.amount)}));
  const toInvoice=S.jobs.filter(j=>(j.status==="done")&&!S.invoices.some(i=>i.jobId===j.id&&i.status!=="cancelled"));
  const cp=crumb([["Papan Pemuka"]])+`<div class="right"><button class="btn" data-act="jrpaste">Tampal Job Request</button><button class="btn pri" data-act="new" data-k="job">+ Rekod Kerja Baharu</button></div>`;
  let main="";

    main+=emptyBox("Selamat Datang ke Sistem Sewaan "+orgLabel(),"Mula dengan menambah pelanggan dan aset sewaan, kemudian cipta rekod kerja dan invois. Atau muatkan beberapa rekod contoh untuk melihat cara ia berfungsi; rekod contoh ditanda dan boleh dipadam sekali gus di Tetapan.",
      `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri" data-act="new" data-k="customer">Tambah Pelanggan</button><button class="btn" data-act="seed">Muatkan Data Contoh</button></div>`);

    <button class="kpi" data-act="kpi" data-v="kerja" data-k="ongoing"><div class="l">Kerja Sedang Berjalan</div><div class="v">${active.length}</div><div class="s">${S.jobs.filter(j=>j.status==="confirmed").length} disahkan, menunggu mula</div></button>
    <button class="kpi" data-act="kpi" data-v="invois" data-k="open"><div class="l">Belum Dikutip</div><div class="v">${RM(open.reduce((a,x)=>a+x.c.due,0))}</div><div class="s">${open.length} invois terbuka</div></button>
    <button class="kpi ${over.length?"alert":""}" data-act="kpi" data-v="invois" data-k="overdue"><div class="l">Lewat Tempoh</div><div class="v">${RM(over.reduce((a,x)=>a+x.c.due,0))}</div><div class="s">${over.length} invois melepasi tarikh akhir</div></button>
    <button class="kpi" data-act="kpi" data-v="invois" data-k="paid"><div class="l">Kutipan Bulan Ini</div><div class="v">${RM(collected)}</div><div class="s">bayaran diterima ${esc(new Date().toLocaleDateString(LOC(),{month:"long",year:"numeric"}))}</div></button>
  </div>`;
  const overRows=open.sort((a,b)=>(a.i.dueDate||"").localeCompare(b.i.dueDate||"")).slice(0,8);
  main+=`<div class="grid2"><section><h2 class="sec">Invois Perlu Dikutip</h2>${overRows.length?`<div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Pelanggan</th><th>Tarikh Akhir</th><th class="r">Baki</th><th>Status</th></tr></thead><tbody>${overRows.map(({i,c})=>`<tr class="click" data-act="open" data-v="invois" data-id="${i.id}"><td class="mono">${esc(i.no)}</td><td>${esc(custName(i.customerId))}</td><td class="num">${dmy(i.dueDate)}</td><td class="r num">${RM(c.due)}</td><td>${invPill(i)}</td></tr>`).join("")}</tbody></table></div>`:emptyBox("Tiada Baki Tertunggak","Semua invois yang disahkan sudah dibayar penuh.")}</section>
  <section><h2 class="sec">Kerja di Tapak Sekarang</h2>${active.length?`<div class="tbl-wrap"><table><thead><tr><th>No. Kerja</th><th>Pelanggan</th><th>Tapak</th><th>Mula</th></tr></thead><tbody>${active.map(j=>`<tr class="click" data-act="open" data-v="kerja" data-id="${j.id}"><td class="mono">${esc(j.no)}</td><td>${esc(custName(j.customerId))}</td><td>${esc(j.site||"—")}</td><td class="num">${dmy(j.startDate)}</td></tr>`).join("")}</tbody></table></div>`:emptyBox("Tiada Kerja Aktif","Kerja yang ditanda Sedang Berjalan akan muncul di sini.")}
  ${toInvoice.length?`<h2 class="sec" style="margin-top:16px">Selesai, Belum Diinvois</h2><div class="tbl-wrap"><table><tbody>${toInvoice.map(j=>`<tr class="click" data-act="open" data-v="kerja" data-id="${j.id}"><td class="mono">${esc(j.no)}</td><td>${esc(custName(j.customerId))}</td><td>${j.do&&j.do.no?`<span class="pill p-ok">DO ${esc(j.do.no)}</span>`:`<span class="pill p-grey">Tiada DO</span>`}</td></tr>`).join("")}</tbody></table></div>`:""}
  </section></div>`;

/* ---- Jobs ---- */
VIEWS.kerja=()=>{
  if(route.id)return jobForm();
  const f=S.flt.kerja||"all";
  let rows=S.jobs.filter(j=>f==="all"||j.status===f).filter(j=>match("kerja",[j.no,custName(j.customerId),j.site,j.po,j.pickup,j.dropoff,j.operator,j.supervisor].join(" ")));
  rows.sort((a,b)=>(b.no||"").localeCompare(a.no||""));
  const cp=crumb([["Rekod Kerja"]])+`<div class="acts"><button class="btn pri" data-act="new" data-k="job">Baharu</button><button class="btn" data-act="jrpaste">Tampal Job Request</button></div><div class="right">${searchBox("kerja","Cari no., pelanggan, tapak…")}</div>`;
  let main=chips("kerja",[["all","Semua"],...Object.entries(JOB_ST).map(([k,v])=>[k,v[0]])]);
  if(!S.jobs.length)main+=emptyBox("Belum Ada Rekod Kerja","Satu rekod kerja mencatat siapa menyewa, aset atau pekerja yang dihantar, lokasi tapak dan tempoh. Dari sini anda cipta invois.",`<button class="btn pri" data-act="new" data-k="job">Cipta Rekod Kerja</button>`);
  else if(!rows.length)main+=emptyBox("Tiada Padanan","Tukar penapis atau carian.");
  else main+=`<div class="tbl-wrap"><table><thead><tr><th>No. Kerja</th><th>Pelanggan</th><th>Projek / Tapak</th><th>Mula</th><th>Tamat</th><th>Item</th><th>Invois</th><th>Status</th></tr></thead><tbody>${rows.map(j=>{const ni=S.invoices.filter(i=>i.jobId===j.id&&i.status!=="cancelled").length;return `<tr class="click" data-act="open" data-v="kerja" data-id="${j.id}"><td class="mono">${esc(j.no)}${exTag(j)}</td><td>${esc(custName(j.customerId))}</td><td>${esc(j.site||"—")}</td><td class="num">${dmy(j.startDate)}</td><td class="num">${dmy(j.endDate)}</td><td>${esc(jobItems(j))}</td><td>${ni?`<span class="pill p-ok">${ni} invois</span>`:`<span class="pill p-grey">Belum</span>`}</td><td>${pill(JOB_ST[j.status]||JOB_ST.draft)}</td></tr>`}).join("")}</tbody><tfoot><tr><td colspan="5">${rows.length} rekod</td><td colspan="3"></td></tr></tfoot></table></div>`;
  return{cp,main};
};

function ensureForm(kind,col,blank){
  if(form&&form.kind===kind&&form.id===route.id)return form;
  if(route.id==="new"){form={kind,id:newId(col),data:blank(),dirty:true,isNew:true};route.id=form.id;return form}
  const d=byId(col,route.id);if(!d)return null;
  form={kind,id:d.id,data:clone(d),dirty:false,isNew:false};return form;
}
function blankLine(){return{assetId:"",desc:"",qty:1,dur:1,unit:"Hari",rate:0}}

function linesTable(F,editable){
  const ls=F.data.lines||[];const P=F.kind==="invoice";const span=P?7:5;
  const assetOpts=sel=>`<option value="">— pilih —</option>`+S.assets.map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.code?a.code+" · ":"")}${esc(a.name)}</option>`).join("");
  return `<div class="tabs"><span>Butiran Sewaan</span></div><div class="lines"><table><thead><tr><th>Aset / Perkhidmatan</th><th>Keterangan</th><th class="r">Kuantiti</th><th class="r">Tempoh</th><th>Unit</th>${P?`<th class="r">Kadar (RM)</th><th class="r">Jumlah</th>`:""}${editable?"<th></th>":""}</tr></thead><tbody>
  ${ls.map((l,i)=>l.type==="note"?(editable?`<tr class="noteline"><td colspan="${span}"><textarea class="cell w" rows="3" data-l="${i}" data-lf="desc" placeholder="cth.&#10;Load : Cable (2 drums)&#10;Time : 09.00 am - 05.00 pm&#10;Pic : En. Hasyinor">${esc(l.desc)}</textarea></td><td><button class="xbtn" title="Buang nota" aria-label="Buang nota" data-act="delline" data-i="${i}">×</button></td></tr>`:`<tr class="noteline"><td colspan="${span}" class="pre">${esc(l.desc)}</td></tr>`):editable?`<tr>
    <td><select class="cell" data-l="${i}" data-lf="assetId">${assetOpts(l.assetId)}</select></td>
    <td><textarea class="cell w" rows="${Math.max(2,String(l.desc||"").split("\n").length)}" data-l="${i}" data-lf="desc" placeholder="cth. Rental of lorry crane (VBE 6317)&#10;(Site A - Site B)">${esc(l.desc)}</textarea><div class="dchips"><button type="button" data-act="descadd" data-i="${i}" data-t="*stay at site">+ Stay at Site</button><button type="button" data-act="descadd" data-i="${i}" data-t="*trip">+ Trip</button>${l.assetId?`<button type="button" data-act="descreset" data-i="${i}" title="Tulis semula dari aset dan lokasi">↻ Semula</button>`:""}</div></td>
    <td><input class="cell n" type="number" step="any" min="0" data-l="${i}" data-lf="qty" value="${esc(l.qty)}"></td>
    <td><input class="cell n" type="number" step="any" min="0" data-l="${i}" data-lf="dur" value="${esc(l.dur)}"></td>
    <td><select class="cell" data-l="${i}" data-lf="unit">${UNITS.map(u=>`<option ${u===l.unit?"selected":""}>${u}</option>`).join("")}</select></td>
    ${P?`<td><input class="cell n" type="number" step="0.01" min="0" data-l="${i}" data-lf="rate" value="${esc(l.rate)}"></td>
    <td class="r num" id="lt-${i}">${rmFmt.format(lineTotal(l))}</td>`:""}
    <td><button class="xbtn" title="Buang baris" aria-label="Buang baris" data-act="delline" data-i="${i}">×</button></td></tr>`
   :`<tr><td>${esc((byId("assets",l.assetId)||{}).name||"—")}</td><td class="pre">${esc(l.desc)}</td><td class="r num">${esc(l.qty)}</td><td class="r num">${esc(l.dur)}</td><td>${esc(l.unit)}</td>${P?`<td class="r num">${rmFmt.format(n(l.rate))}</td><td class="r num">${rmFmt.format(lineTotal(l))}</td>`:""}</tr>`).join("")}
  ${!ls.length?`<tr><td colspan="${span+1}" style="color:var(--muted)">Tiada baris lagi.</td></tr>`:""}
  </tbody></table>${editable?`<button class="addline" data-act="addline">+ Tambah Baris</button><button class="addline" data-act="addnote">+ Tambah Nota</button>`:""}</div>`;
}
function custSelect(F,editable){
  if(!editable)return `<div class="ro">${esc(custName(F.data.customerId))}</div>`;
  return `<select data-f="customerId" id="f-cust"><option value="">— pilih pelanggan —</option>${S.customers.map(c=>`<option value="${c.id}" ${c.id===F.data.customerId?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`;
}
function fld(label,key,F,editable,type,extra){
  const v=F.data[key];const id="f-"+key;
  if(!editable)return `<div class="fld"><label>${label}</label><div class="ro ${type==="date"?"num":""}">${esc(type==="date"?dmy(v):(v||"—"))}</div></div>`;
  return `<div class="fld"><label for="${id}">${label}</label><input id="${id}" type="${type||"text"}" data-f="${key}" value="${esc(v)}" ${extra||""}></div>`;
}
function chatter(F){
  const log=(F.data.log||[]).slice().reverse();
  return `<section class="chatter"><h3>Log Aktiviti</h3>${F.isNew?`<p style="color:var(--muted)">Simpan rekod ini dahulu untuk menulis nota.</p>`:`<div class="note-in"><input id="note" placeholder="Tulis nota dalaman, cth. operator tiba di tapak 8 pagi"><button class="btn" data-act="note">Catat</button></div>`}
  <div class="log">${log.map(e=>`<div class="e"><div>${esc(e.msg)}</div><div class="m">${esc(e.by||"Pengguna")} · ${esc(new Date(e.t).toLocaleString(LOC(),{dateStyle:"medium",timeStyle:"short"}))}</div></div>`).join("")||`<div class="e"><div class="m">Belum ada aktiviti.</div></div>`}</div></section>`;
}
function saveBtns(F){return F.dirty?`<button class="btn pri" data-act="save">Simpan</button><button class="btn" data-act="discard">Buang Perubahan</button>`:""}

function jobForm(){
  const F=ensureForm("job","jobs",()=>({no:nextNo("JOB",S.jobs),customerId:"",site:"",po:"",operator:"",startDate:todayISO(),endDate:"",status:"draft",lines:[blankLine()],notes:"",log:[logEntry("Rekod kerja dicipta")],createdAt:new Date().toISOString()}));
  if(!F)return{cp:crumb([["Rekod Kerja","kerja"],["Tidak dijumpai"]]),main:emptyBox("Rekod Tidak Dijumpai","Rekod ini mungkin telah dipadam.")};
  const d=F.data,st=d.status;const ed=S.canWrite&&st!=="done"&&st!=="cancelled";

  const invs=S.invoices.filter(i=>i.jobId===F.id);
  let acts=saveBtns(F);
  if(!F.dirty&&S.canWrite){

    if(st==="cancelled"||st==="done")acts+=`<button class="btn" data-act="jobst" data-k="draft">Tetap Semula ke Draf</button>`;

  const cp=crumb([["Rekod Kerja","kerja"],[esc(d.no)]])+`<div class="acts">${acts}</div><div class="right">${st==="cancelled"?pill(JOB_ST.cancelled):steps(JOB_FLOW,JOB_ST,st)}</div>`;
  const main=`<div class="sheet">
    <div class="sheet-head"><div class="doc-no"><small>Rekod Kerja Sewaan${d.example?" · contoh":""}</small><span class="mono" style="font-family:var(--f-display)">${esc(d.no)}</span></div>
    <div class="smart"><button data-act="jobinvs"><b>${invs.length}</b><span>Invois</span></button><button data-act="jobinvs"><b>${RM(invs.filter(i=>i.status==="posted").reduce((a,i)=>a+invCalc(i).total,0))}</b><span>Telah diinvois</span></button></div></div>
    <div class="fields">
      <div class="fld"><label for="f-cust">Pelanggan</label>${custSelect(F,ed)}</div>
      ${fld("Tarikh Mula","startDate",F,ed,"date")}
      ${fld("Projek / Tapak","site",F,ed,"text",'placeholder="cth. MINI PPU JEMENTAH"')}
      ${fld("Tarikh Tamat","endDate",F,ed,"date")}
      ${fld("No. PO / Rujukan","po",F,ed,"text",'placeholder="PO pelanggan"')}
      ${fld("Masa","time",F,ed,"text",'placeholder="cth. 9:30 AM"')}
      ${fld("Load / Muatan","load",F,ed,"text",'placeholder="cth. 3 DRUM CABLES 3C X 500"')}
      ${fld("Cawangan","branch",F,ed,"text",'placeholder="cth. OSJ"')}
      ${fld("Pickup","pickup",F,ed,"text",'placeholder="Lokasi ambil"')}
      ${fld("Kenderaan","vehicle",F,ed,"text",'placeholder="cth. AQS ENTERPRISE (sewa) / VBE 6317"')}
      ${fld("Dropoff","dropoff",F,ed,"text",'placeholder="Lokasi hantar"')}
      ${fld("Pemandu / Operator","operator",F,ed,"text",'placeholder="Nama & no. telefon"')}
      <div class="fld"><label for="f-fleet">Kenderaan Oleh</label>${ed?`<select id="f-fleet" data-f="fleet"><option value="own" ${d.fleet!=="vendor"?"selected":""}>Lori Sendiri</option><option value="vendor" ${d.fleet==="vendor"?"selected":""}>Lori Vendor</option></select>`:`<div class="ro">${d.fleet==="vendor"?"Lori Vendor":"Lori Sendiri"}</div>`}</div>

VIEWS.invois=()=>{
  if(route.id)return invForm();
  const f=S.flt.invois||"all";
  let rows=S.invoices.map(i=>({i,c:invCalc(i)})).filter(({i,c})=>{
    if(S.jobFilter&&i.jobId!==S.jobFilter)return false;
    if(f==="all")return true;if(f==="draft")return i.status==="draft";if(f==="cancelled")return i.status==="cancelled";
    if(f==="open")return i.status==="posted"&&c.due>0.005;return c.pay===f}).filter(({i})=>match("invois",[i.no,custName(i.customerId),(byId("jobs",i.jobId)||{}).no].join(" ")));
  rows.sort((a,b)=>(b.i.date||"").localeCompare(a.i.date||"")||(b.i.no||"").localeCompare(a.i.no||""));
  const jf=S.jobFilter?byId("jobs",S.jobFilter):null;
  const cp=crumb([["Invois"]])+`<div class="acts"><button class="btn pri" data-act="new" data-k="invoice">Baharu</button><button class="btn" data-act="csv">Eksport CSV</button></div><div class="right">${searchBox("invois","Cari no., pelanggan, kerja…")}</div>`;
  let main=(jf?`<div class="chips"><button class="chip on" data-act="clearjf">Kerja ${esc(jf.no)} ×</button></div>`:"")+chips("invois",[["all","Semua"],["draft","Draf"],["open","Terbuka"],["unpaid","Belum Dibayar"],["partial","Sebahagian"],["overdue","Lewat Tempoh"],["paid","Dibayar"],["cancelled","Dibatalkan"]]);
  if(!S.invoices.length)main+=emptyBox("Belum Ada Invois","Cara paling cepat: buka rekod kerja yang disahkan dan tekan Cipta Invois. Butiran sewaan akan disalin terus.",`<button class="btn pri" data-act="nav2" data-v="kerja">Pergi ke Rekod Kerja</button>`);
  else if(!rows.length)main+=emptyBox("Tiada Padanan","Tukar penapis atau carian.");
  else main+=`<div class="tbl-wrap"><table><thead><tr><th>No. Invois</th><th>Pelanggan</th><th>Rekod Kerja</th><th>Tarikh</th><th>Tarikh Akhir</th><th class="r">Jumlah</th><th class="r">Baki</th><th>Status</th></tr></thead><tbody>${rows.map(({i,c})=>`<tr class="click" data-act="open" data-v="invois" data-id="${i.id}"><td class="mono">${esc(i.no||"Draf")}${exTag(i)}</td><td>${esc(custName(i.customerId))}</td><td class="mono">${esc((byId("jobs",i.jobId)||{}).no||"—")}</td><td class="num">${dmy(i.date)}</td><td class="num">${dmy(i.dueDate)}</td><td class="r num">${RM(c.total)}</td><td class="r num">${i.status==="posted"?RM(c.due):"—"}</td><td>${invPill(i)}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="5">${rows.length} invois</td><td class="r num">${RM(rows.reduce((a,x)=>a+(x.i.status==="cancelled"?0:x.c.total),0))}</td><td class="r num">${RM(rows.reduce((a,x)=>a+(x.i.status==="posted"?x.c.due:0),0))}</td><td></td></tr></tfoot></table></div>`;
  return{cp,main};
};

function invForm(){
  const C=S.company;
  const F=ensureForm("invoice","invoices",()=>({no:"",jobId:"",customerId:"",date:todayISO(),dueDate:addDays(todayISO(),C.terms??15),status:"draft",taxRate:C.defaultTax??0,lines:[blankLine()],payments:[],notes:"",log:[logEntry("Invois draf dicipta")],createdAt:new Date().toISOString()}));

  const pays=d.payments||[];
  const main=`<div class="sheet">
    ${st==="posted"&&c.pay==="paid"?`<div class="ribbon">${pill(PAY_ST.paid)}</div>`:""}
    <div class="sheet-head"><div class="doc-no"><small>Invois Pelanggan${d.example?" · contoh":""}</small>${esc(d.no||"Draf")}</div></div>
    <div class="fields">
      <div class="fld"><label for="f-cust">Pelanggan</label>${custSelect(F,ed)}</div>
      ${fld("Tarikh Invois","date",F,ed,"date")}
      <div class="fld"><label for="f-jobId">Rekod Kerja</label>${jobSel}</div>
      ${fld("Rujukan (DO / PO)","ref",F,ed,"text",'placeholder="cth. DO : 20163"')}
      ${fld("Tarikh Akhir Bayar","dueDate",F,ed,"date")}
      ${ed?`<div class="fld"><label for="f-taxRate">Cukai Perkhidmatan (%)</label><input id="f-taxRate" type="number" step="0.01" min="0" data-f="taxRate" value="${esc(d.taxRate)}"></div>`:`<div class="fld"><label>Cukai Perkhidmatan</label><div class="ro num">${esc(n(d.taxRate))}%</div></div>`}
    </div>
    ${linesTable(F,ed)}
    <div class="totals"><table>
      <tr><td>Jumlah Kecil</td><td class="r num" id="tot-sub">${RM(c.sub)}</td></tr>
      <tr ${n(d.taxRate)>0||ed?"":"hidden"}><td>SST (${esc(n(d.taxRate))}%)</td><td class="r num" id="tot-tax">${RM(c.tax)}</td></tr>
      <tr class="big"><td>Jumlah</td><td class="r num" id="tot-total">${RM(c.total)}</td></tr>
      ${pays.map((p,i)=>`<tr><td style="color:var(--muted)">Dibayar ${dmy(p.date)} · ${esc(p.method)}${p.ref?" · "+esc(p.ref):""} ${S.canWrite&&st==="posted"?`<button class="xbtn" title="Buang bayaran" aria-label="Buang bayaran" data-act="delpay" data-i="${i}">×</button>`:""}</td><td class="r num" style="color:var(--muted)">− ${RM(p.amount)}</td></tr>`).join("")}
      ${st==="posted"?`<tr class="${c.due>0.005?"due":""}"><td>Baki Perlu Dibayar</td><td class="r num">${RM(c.due)}</td></tr>`:""}
    </table></div>
    <div class="notes"><label for="f-notes" style="font-weight:600;font-size:13px">Nota pada Invois</label>${ed?`<textarea id="f-notes" data-f="notes">${esc(d.notes)}</textarea>`:`<p>${esc(d.notes||"—")}</p>`}</div>

/* ---------- job request paste ---------- */
function parseJR(text){
  const out={load:"",branch:"",qty:1,item:"",status:"draft",no:"",date:"",time:"",company:"",project:"",pickup:"",dropoff:"",vehicle:"",driver:"",supervisor:""};
  const KEYS=[[/^(load|muatan|barang|cargo)$/,"load"],[/^(branch|cawangan)$/,"branch"],[/^(no\.?\s*job|job\s*no\.?|no\.?\s*kerja)$/,"no"],[/^(tarikh|date)$/,"date"],[/^(masa|time)$/,"time"],[/^(company|syarikat|client|pelanggan)$/,"company"],[/^(project|projek|site|tapak)$/,"project"],[/^(pickup|pick\s*up|ambil|dari)$/,"pickup"],[/^(drop\s*off|dropoff|hantar|ke)$/,"dropoff"],[/^(kenderaan|vehicle|lori|lorry)$/,"vehicle"],[/^(pemandu|driver|operator)$/,"driver"],[/^(sv\s*tapak|sv|supervisor|pic|penyelia)$/,"supervisor"]];
  const lines=String(text||"").replace(/\r/g,"").split("\n").map(x=>x.replace(/[*_~]/g,"").trim()).filter(Boolean);
  lines.forEach((ln,i)=>{
    const m=/^([^:]{1,30}?)\s*:\s*(.*)$/.exec(ln);
    if(m){const k=m[1].toLowerCase().replace(/\s+/g," ").trim();const hit=KEYS.find(([re])=>re.test(k));if(hit){out[hit[1]]=m[2].trim();return}}
    if(!out.item&&i<3&&!m){
      const segs=ln.split(/\s*[—–]+\s*|\s+-\s+/).map(x=>x.trim()).filter(Boolean);
      segs.forEach(sg=>{const low=sg.toLowerCase();if(/confirm|disahkan/.test(low))out.status="confirmed";else if(/cancel|batal/.test(low))out.status="cancelled"});
      const withQty=segs.find(sg=>/^\d+(?:\.\d+)?\s*(?:x\s+)?[a-z]/i.test(sg));
      if(withQty){const h=/^(\d+(?:\.\d+)?)\s*(?:x\s+)?(.+)$/i.exec(withQty);out.qty=n(h[1]);out.item=h[2].trim()}
      else{const it=segs.find(sg=>!/confirm|disahkan|cancel|batal|job\s*request/i.test(sg));if(it)out.item=it}
    }
  });
  const d=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/.exec(out.date);
  out.dateISO=d?((d[3].length===2?"20"+d[3]:d[3])+"-"+d[2].padStart(2,"0")+"-"+d[1].padStart(2,"0")):"";
  return out;
}
const NOTE_KEYS=/^\s*(load|time|pic)\s*:/i;
function syncNote(d){
  const want=[d.load?"Load : "+d.load:"",d.time?"Time : "+d.time:"",d.supervisor?"Pic : "+d.supervisor:""].filter(Boolean);
  const ls=d.lines||(d.lines=[]);
  const idx=ls.findIndex(l=>l.type==="note"&&(l.auto||String(l.desc||"").split("\n").some(x=>NOTE_KEYS.test(x))));
  if(!want.length&&idx<0)return false;
  const others=idx>=0?String(ls[idx].desc||"").split("\n").filter(x=>x.trim()&&!NOTE_KEYS.test(x)):[];
  const text=want.concat(others).join("\n");
  if(idx>=0){ls[idx].auto=true;if(ls[idx].desc===text)return false;ls[idx].desc=text}
  else ls.push({type:"note",auto:true,desc:text});
  return true;
}
function syncRoutes(d){
  let ch=false;const rt=routeText(d.pickup,d.dropoff);
  (d.lines||[]).forEach(l=>{if(l.type==="note"||!l.assetId)return;const parts=String(l.desc||"").split("\n");
    if(parts.length>1&&/^\(.*\)$/.test(parts[1].trim())){if(rt){if(parts[1]!==rt){parts[1]=rt;ch=true}}else{parts.splice(1,1);ch=true}}
    else if(rt&&parts.length>=1&&parts[0]){parts.splice(1,0,rt);ch=true}
    l.desc=parts.join("\n")});
  return ch;
}
function addLineKeepNotes(ls,line){let k=ls.length;while(k>0&&ls[k-1].type==="note")k--;ls.splice(k,0,line)}
function assetDesc(a,fallbackItem){
  const nm=String(a?a.name:fallbackItem||"").trim();if(!nm)return"";
  const base=/^rental\b/i.test(nm)?nm.charAt(0).toUpperCase()+nm.slice(1).toLowerCase():"Rental of "+nm.toLowerCase();
  return base+(a&&a.plate?" ("+a.plate+")":"");
}
function routeText(pickup,dropoff){return pickup||dropoff?"("+[titleCase(pickup),titleCase(dropoff)].filter(Boolean).join(" - ")+")":""}
function lineContext(){if(!form)return{};if(form.kind==="job")return form.data;const j=byId("jobs",form.data.jobId);return j||{}}
function buildDesc(a,ctx,oldDesc){
  const extras=String(oldDesc||"").split("\n").filter(x=>/^\s*\*/.test(x));
  return [assetDesc(a),routeText(ctx.pickup,ctx.dropoff)].concat(extras).filter(Boolean).join("\n");
}
const titleCase=t=>String(t||"").toLowerCase().replace(/(^|[\s(\/-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function findCustomer(name){const q=String(name||"").toLowerCase().replace(/sdn\.?\s*bhd\.?|\(m\)|[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();if(!q)return null;
  return S.customers.find(c=>(c.name||"").toLowerCase()===String(name).toLowerCase())||S.customers.find(c=>(c.name||"").toLowerCase().includes(q))||null}
function findAsset(item,vehicle){const t=(item+" "+vehicle).toLowerCase();
  return S.assets.find(a=>a.plate&&t.includes(a.plate.toLowerCase().replace(/\s+/g," ")))||S.assets.find(a=>a.name&&t.includes(a.name.toLowerCase()))||S.assets.find(a=>a.name&&item&&a.name.toLowerCase().includes(item.toLowerCase()))||null}
function jrToJob(P){const R=jrToJob0(P);if(R.job.driverId)applyDriver(R.job,drivers().find(x=>x.id===R.job.driverId));return R}
function jrToJob0(P){
  const cust=findCustomer(P.company),asset=findAsset(P.item,P.vehicle);
  const base=assetDesc(asset,P.item),plate="";
  const route=P.pickup||P.dropoff?"\n"+routeText(P.pickup,P.dropoff):"";
  const lines=[{assetId:asset?asset.id:"",desc:base+plate+route,qty:P.qty||1,dur:1,unit:asset?asset.unit||"Trip":"Trip",rate:0}];
  const note=[P.load?"Load : "+P.load:"",P.time?"Time : "+P.time:"",P.supervisor?"Pic : "+P.supervisor:""].filter(Boolean).join("\n");
  if(note)lines.push({type:"note",auto:true,desc:note});
  const drv=P.driver?drivers().find(x=>x.name&&P.driver.toLowerCase().includes(String(x.name).toLowerCase().split(" ")[0])):null;
  return{cust,asset,job:{load:P.load,branch:P.branch,driverId:drv?drv.id:"",no:P.no||nextNo("JOB",S.jobs),customerId:cust?cust.id:"",site:P.project,po:"",time:P.time,pickup:P.pickup,dropoff:P.dropoff,vehicle:P.vehicle,operator:P.driver,supervisor:P.supervisor,startDate:P.dateISO||todayISO(),endDate:"",status:P.status==="cancelled"?"draft":P.status,lines,notes:"",source:"job-request",log:[logEntry("Dicipta daripada Job Request"+(P.no?" "+P.no:""))],createdAt:new Date().toISOString()}};
}

function applyDriver(d,drv){
  if(!drv)return d;
  const plates=drivers().map(x=>x.plate).filter(Boolean);
  let v=String(d.vehicle||"");plates.forEach(p=>{v=v.split(" / "+p).join("").split(p).join("")});v=v.replace(/\s*\/\s*$/,"").trim();
  d.vehicle=drv.plate?(v?v+" / "+drv.plate:drv.plate):v;
  d.operator=drv.name+(drv.phone?" ("+drv.phone+")":"");
  const norm=x=>String(x||"").toUpperCase().replace(/\s+/g,"");
  const mine=drv.plate?S.assets.find(a=>a.plate&&norm(a.plate)===norm(drv.plate)):null;
  if(mine)(d.lines||[]).forEach(l=>{if(l.type==="note")return;const cur=byId("assets",l.assetId);
    if((!l.assetId||(cur&&cur.plate&&norm(cur.plate)!==norm(mine.plate)))&&(!cur||String(cur.name).toLowerCase()===String(mine.name).toLowerCase()||!l.assetId)){l.assetId=mine.id;l.unit=mine.unit||l.unit;l.desc=buildDesc(mine,d,l.desc)}});
  return d;
}

function sigPad(canvas){
  const ctx=canvas.getContext("2d");let drawing=false,dirty=false,last=null;
  const fit=()=>{const rc=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,rc.width*dpr);canvas.height=Math.max(1,rc.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0d2f7a";ctx.fillStyle="#0d2f7a";dirty=false};
  fit();
  const pos=e=>{const rc=canvas.getBoundingClientRect();return[e.clientX-rc.left,e.clientY-rc.top]};
  canvas.addEventListener("pointerdown",e=>{e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){}drawing=true;last=pos(e);ctx.beginPath();ctx.arc(last[0],last[1],1.2,0,6.3);ctx.fill();dirty=true;canvas.classList.add("signed")});
  canvas.addEventListener("pointermove",e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p});
  const up=()=>{drawing=false};canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);canvas.addEventListener("pointerleave",up);
  return{clear:()=>{fit();canvas.classList.remove("signed")},isEmpty:()=>!dirty,toData:()=>{const w=Math.min(600,canvas.width),h=Math.round(canvas.height*w/canvas.width);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(canvas,0,0,w,h);return c.toDataURL("image/png")}};
}
function loadItems(load){

<table class="it"><thead><tr><th style="width:14mm">NO.</th><th>DESCRIPTION</th><th style="width:36mm">QUANTITY</th></tr></thead><tbody>${rows}</tbody></table>
<table class="dl"><tr><td>TIME OF DELIVERY :</td><td>${esc(t)}</td></tr><tr><td>FROM :</td><td>${esc(D.from||"")}</td></tr><tr><td>DELIVERY TO :</td><td>${esc(D.to||"")}</td></tr></table>

 <div class="kv"><span>NAME</span><span>${esc(D.receiver&&D.receiver.name||"")}</span></div><div class="kv"><span>I/C NO</span><span>${esc(D.receiver&&D.receiver.ic||"")}</span></div><div class="kv"><span>DATE</span><span>${D.receiver&&D.receiver.signedAt?esc(new Date(D.receiver.signedAt).toLocaleString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})):""}</span></div></div>
 <div class="sig">${D.issuer&&D.issuer.sig?`<img src="${esc(D.issuer.sig)}" alt="">`:`<div style="height:20mm"></div>`}<div class="ln">(Issued by)</div>

<div class="foot">Digitally signed delivery order · ${esc(j.no)}</div>
</div>`;
}

/* ---------- Supabase data layer (same shape the views use) ---------- */
const TABLES={customers:1,assets:1,jobs:1,invoices:1,config:1};
function mapErr(e){const c=e&&(e.code||"");if(c==="42501"||/row-level security|permission/i.test(e&&e.message||""))return{code:"invalid_argument",message:e.message};return{code:"unavailable",message:e&&e.message}}
function makeDB(sb){
  const scope=q=>S.org?q.eq("org",S.org):q;
  const loaders={};const refresh=t=>(loaders[t]||new Set()).forEach(f=>f());
  function docRef(table,id){
    if(!TABLES[table])throw new TypeError("unknown table "+table);
    return{id,path:table+"/"+id,
      async set(data){const row={id,data,updated_by:S.userName||null,updated_at:new Date().toISOString()};if(S.org)row.org=S.org;const{error}=await sb.from(table).upsert(row,{onConflict:S.org?"org,id":"id"});if(error)throw mapErr(error);refresh(table)},
      async update(patch){const{data:row,error:e1}=await scope(sb.from(table).select("data").eq("id",id)).maybeSingle();if(e1)throw mapErr(e1);if(!row)throw{code:"invalid_argument",message:"not found"};const{error}=await scope(sb.from(table).update({data:Object.assign({},row.data,patch),updated_by:S.userName||null,updated_at:new Date().toISOString()}).eq("id",id));if(error)throw mapErr(error);refresh(table)},
      async delete(){const{error}=await scope(sb.from(table).delete().eq("id",id));if(error)throw mapErr(error);refresh(table)},
      onSnapshot(next,err){return watch(table,rows=>{const r=rows.find(x=>x.id===id);next({id,exists:!!r,data:()=>r?r.data:undefined,metadata:{fromCache:false,hasPendingWrites:false}})},err,id)}};
  }
  async function fetchAll(table,id){
    let out=[],from=0;for(;;){let q=scope(sb.from(table).select("id,data")).range(from,from+999);if(id)q=q.eq("id",id);const{data,error}=await q;if(error)throw mapErr(error);out=out.concat(data);if(data.length<1000)break;from+=1000}return out;
  }
  function watch(table,cb,err,id){
    let t=null,alive=true;
    const load=async()=>{try{const rows=await fetchAll(table,id);if(alive)cb(rows)}catch(e){if(alive&&err)err(e)}};
    load();(loaders[table]=loaders[table]||new Set()).add(load);
    const ch=sb.channel("rt-"+table+(id?"-"+id:"")+"-"+Math.random().toString(36).slice(2)).on("postgres_changes",Object.assign({event:"*",schema:"public",table},S.org?{filter:"org=eq."+S.org}:{}),()=>{clearTimeout(t);t=setTimeout(load,250)}).subscribe();
    const iv=setInterval(()=>{if(document.visibilityState==="visible")load()},60000);
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
    return()=>{alive=false;loaders[table].delete(load);clearInterval(iv);sb.removeChannel(ch)};
  }
  return{
    collection:c=>({path:c,doc:id=>docRef(c,id||(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))),
      onSnapshot(next,err){return watch(c,rows=>next({docs:rows.map(r=>({id:r.id,exists:true,data:()=>r.data,metadata:{fromCache:false,hasPendingWrites:false}})),size:rows.length,empty:!rows.length,metadata:{fromCache:false,hasPendingWrites:false}}),err)}}),
    doc:p=>{const[c,id]=p.split("/");return docRef(c,id)}
  };
}

function loginView(mode,msg){
  $("#cp").innerHTML="";$("#nav").innerHTML="";$("#who").innerHTML=langBtn();
  const titles={login:["Log Masuk","Masukkan e-mel dan kata laluan akaun anda."],forgot:["Tetapkan Semula Kata Laluan","Kami akan hantar pautan ke e-mel anda."],setpwd:["Tetapkan Kata Laluan","Pilih kata laluan untuk akaun anda (sekurang-kurangnya 8 aksara)."]};
  const[h,p]=titles[mode];
  $("#main").innerHTML=`<form class="login" id="lf"><h1>${h}</h1><p>${p}</p>
   ${mode!=="setpwd"?`<label for="l-email">E-mel</label><input id="l-email" type="email" autocomplete="username" required>`:""}
   ${mode!=="forgot"?`<label for="l-pwd">Kata Laluan</label><input id="l-pwd" type="password" autocomplete="${mode==="setpwd"?"new-password":"current-password"}" minlength="${mode==="setpwd"?8:1}" required>`:""}
   <button class="btn pri" type="submit">${mode==="login"?"Log Masuk":mode==="forgot"?"Hantar Pautan":"Simpan Kata Laluan"}</button>
   ${mode==="login"?`<button type="button" class="lnk" id="l-forgot">Lupa Kata Laluan?</button>`:""}${mode==="forgot"?`<button type="button" class="lnk" id="l-back">Kembali ke Log Masuk</button>`:""}
   <div class="err" id="l-err">${msg?esc(msg):""}</div></form>`;
  const f=$("#lf"),er=$("#l-err");
  const fg=$("#l-forgot");if(fg)fg.onclick=()=>loginView("forgot");const bk=$("#l-back");if(bk)bk.onclick=()=>loginView("login");
  f.onsubmit=async e=>{e.preventDefault();er.textContent="";const b=f.querySelector("button[type=submit]");b.disabled=true;
    try{
      if(mode==="login"){const{error}=await sb.auth.signInWithPassword({email:$("#l-email").value.trim(),password:$("#l-pwd").value});if(error)throw error}
      else if(mode==="forgot"){const{error}=await sb.auth.resetPasswordForEmail($("#l-email").value.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;er.style.color="var(--ok)";er.textContent="Pautan dihantar. Semak e-mel anda."}
      else{const{error}=await sb.auth.updateUser({password:$("#l-pwd").value});if(error)throw error;history.replaceState(null,"",location.pathname);location.reload()}
    }catch(x){er.style.color="";const m=x.message||"";er.textContent=/Invalid login/i.test(m)?"E-mel atau kata laluan salah.":/logins are disabled/i.test(m)?"Log masuk e-mel dimatikan di Supabase. Pentadbir perlu hidupkan Authentication → Sign In / Providers → Email.":/not confirmed/i.test(m)?"E-mel belum disahkan. Pentadbir perlu tanda Auto Confirm User atau sahkan pengguna di Supabase.":(m||"Gagal. Cuba lagi.")}
    b.disabled=false};
  const first=f.querySelector("input");first&&first.focus();
}

function writeOrg(v){try{v?localStorage.setItem("aqs-org",v):localStorage.removeItem("aqs-org")}catch(e){}}

let started=false;
async function start(session){
  if(started)return;started=true;
  if(/access_token|type=/.test(location.hash))history.replaceState(null,"",location.pathname+(NAV.some(x=>x[0]===hv)?"#"+hv:""));
  S.uid=session.user.id;S.userName=session.user.email;
  $("#who").innerHTML=langBtn()+`<span class="em">${esc(S.userName)}</span><button data-act="logout">Log Keluar</button>`;
  S.db=makeDB(sb);
  S.sb=sb;
  let multi=false;
  try{const{data:mem,error}=await sb.from("members").select("org,role,name").eq("email",String(S.userName).toLowerCase());
    if(!error){multi=true;const{data:orgs}=await sb.from("orgs").select("id,name");
      S.orgs=(mem||[]).map(m=>({id:m.org,role:m.role,name:((orgs||[]).find(o=>o.id===m.org)||{}).name||m.org.toUpperCase()}));
      if(!S.orgs.length)S.canWrite=false;
      else{const saved=readOrg();const pick=S.orgs.find(o=>o.id===saved)||(S.orgs.length===1?S.orgs[0]:null);
        if(!pick){orgPicker();return}
        S.org=pick.id;S.orgName=pick.name;writeOrg(pick.id)}}}catch(e){}
  if(!multi){try{const{data,error}=await sb.rpc("is_staff");if(!error&&data===false)S.canWrite=false}catch(e){}}
  try{await loadStaff()}catch(e){}
  loadOrgLogo();
  if(S.orgName)applyBrand();
  if(S.orgs&&S.orgs.length>1)$("#who").insertAdjacentHTML("afterbegin",`<button data-act="switchorg" title="Tukar Syarikat" aria-label="Tukar Syarikat"><span aria-hidden="true">⇄</span><span class="lbl"> Tukar Syarikat</span></button>`);
  if(S.isDriver){S.driverId=readDriverId();route.view="tugasan";route.id=null;S.loaded.add("invoices");$("#who").innerHTML=langBtn()+`<span class="em">${esc((S.me&&S.me.name)||S.userName)}</span><button data-act="logout">Log Keluar</button>`}
  render();
  const timer=setTimeout(()=>{if(!isLoaded()){S.offline=true;COLS.forEach(c=>S.loaded.add(c));render()}},10000);
  const onData=()=>{if(isLoaded())clearTimeout(timer);if(S.offline&&isLoaded())S.offline=false;
    if(form&&form.dirty)return;
    if(form&&form.kind!=="company"&&!form.isNew){const d=byId(COLMAP[form.kind],form.id);if(d)form.data=clone(d)}
    if(form&&form.kind==="company")form=null;
    if($("#overlay").innerHTML)return;
    const active=document.activeElement;const keep=active&&active.dataset&&active.dataset.q?active.dataset.q:null;const noteVal=($("#note")||{}).value;
    render();
    if(keep){const el=document.getElementById("q-"+keep);if(el){el.focus();const L=el.value.length;try{el.setSelectionRange(L,L)}catch(_){}}}
    if(noteVal&&$("#note"))$("#note").value=noteVal;
  };
  COLS.filter(c=>!(S.isDriver&&c==="invoices")).forEach(c=>{
    S.db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded.add(c);onData()},
      err=>{S.loaded.add(c);S.offline=true;onData()});
  });
  S.db.doc("config/company").onSnapshot(s=>{S.company=s.exists?s.data():{};if(S.org)applyBrand();onData()},()=>{});
}

async function vendorMode(tok){
  S.sb=sb;$("#nav").innerHTML="";$("#who").innerHTML="";$("#cp").innerHTML=`<div class="crumb"><span>Delivery Order</span></div>`;
  $("#main").innerHTML=emptyBox("Memuatkan Job…","Sila tunggu sebentar.");

  if(!res||res.error){const m={used:["DO Sudah Dihantar","DO untuk pautan ini sudah dihantar. Terima kasih."],expired:["Pautan Tamat Tempoh","Pautan ini sudah tamat tempoh. Minta pautan baharu daripada admin."]}[res&&res.error]||["Pautan Tidak Sah","Pautan ini tidak sah atau tidak dapat dibuka. Semak internet, atau minta pautan baharu daripada admin."];$("#main").innerHTML=emptyBox(m[0],m[1]);return}
